name: build-and-push-image

"on":
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short commit SHA
        id: sha
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('short', context.sha.slice(0, 12))
            core.setOutput('image', 'ghcr.io/' + context.repo.owner.toLowerCase() + '/searchhub')

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ github.ref_type == 'tag' && format('{0}:{1},{0}:latest', steps.sha.outputs.image, github.ref_name) || format('{0}:latest,{0}:sha-{1}', steps.sha.outputs.image, steps.sha.outputs.short) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
